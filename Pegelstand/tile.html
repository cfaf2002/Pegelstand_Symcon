<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
    }

    #tile {
        --hdr: clamp(46px, 11cqmin, 54px);
        --sky1: #0e2233;
        --sky2: #173a52;
        --w1: #3b9be0;
        --w2: #0b4a86;
        --wspeed: 8s;
        --wspeed2: 13s;
        --wamp: 1;
        --pad-left: 0px;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        container-type: size;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%);
        border-radius: inherit;
        cursor: pointer;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        transition: background 2s;
    }

    /* Himmel nach Tageszeit */
    #tile.sky-day   { --sky1: #4f8fc0; --sky2: #b9dcef; }
    #tile.sky-dusk  { --sky1: #23305a; --sky2: #b7673f; }
    #tile.sky-night { --sky1: #070f19; --sky2: #132538; }

    /* Wasserfarbe nach Zustand */
    #tile.st-low    { --w1: #6cc3e6; --w2: #2a74a3; }
    #tile.st-high   { --w1: #f5ad3c; --w2: #b0561a; }
    #tile.st-warn   { --w1: #ef5a5f; --w2: #8c1c22; }
    #tile.st-nodata { --w1: #6b7a86; --w2: #3a4650; }

    #tile.sky-day .content { text-shadow: 0 1px 4px rgba(0, 40, 80, .55); }
    #tile.sky-day .ref span { text-shadow: 0 1px 3px rgba(0, 40, 80, .7); }

    #tile.with-staff { --pad-left: clamp(30px, 13cqmin, 44px); }

    /* ---------- Sterne ---------- */
    .stars {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 2s;
        pointer-events: none;
    }

    #tile.sky-night .stars { opacity: 1; }
    #tile.sky-dusk .stars  { opacity: .35; }

    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #fff;
        animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
        0%, 100% { opacity: .9; }
        50%      { opacity: .25; }
    }

    /* ---------- Wasser ---------- */
    .water {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 50%;
        transition: height 1.4s cubic-bezier(.25, .8, .25, 1);
    }

    .water .body {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, var(--w1) 0%, var(--w2) 100%);
        transition: background .8s;
    }

    .wave {
        position: absolute;
        left: 0;
        width: 200%;
        fill: var(--w1);
        transform-origin: bottom;
        transition: fill .8s;
    }

    .wave.back {
        top: -16px;
        height: 16px;
        opacity: .45;
        animation: drift var(--wspeed2) linear infinite reverse;
    }

    .wave.front {
        top: -13px;
        height: 14px;
        animation: drift var(--wspeed) linear infinite;
    }

    .wave svg {
        width: 100%;
        height: 100%;
        display: block;
        transform: scaleY(var(--wamp));
        transform-origin: bottom;
        transition: transform 1s;
    }

    @keyframes drift {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
    }

    .shine {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 60% at 20% 0%, rgba(255, 255, 255, .22), transparent 60%);
        pointer-events: none;
    }

    /* Strömungsstreifen im Wasser */
    .current {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0;
        transition: opacity 1s;
    }

    #tile.flow-up .current { opacity: .5; }

    .current i {
        position: absolute;
        height: 2px;
        width: 22%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
        animation: stream 2.6s linear infinite;
    }

    @keyframes stream {
        from { transform: translateX(-120%); }
        to   { transform: translateX(560%); }
    }

    /* ---------- Regen ---------- */
    .rain {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0;
        transition: opacity 1s;
        pointer-events: none;
    }

    #tile.raining .rain { opacity: 1; }

    .rain i {
        position: absolute;
        top: -20%;
        width: 1px;
        height: 14%;
        background: linear-gradient(180deg, transparent, rgba(220, 235, 255, .7));
        animation: fall 0.9s linear infinite;
    }

    @keyframes fall {
        to { transform: translateY(800%); }
    }

    /* ---------- Pegellatte ---------- */
    .staff {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: var(--pad-left);
        display: none;
        pointer-events: none;
    }

    #tile.with-staff .staff { display: block; }

    .staff .bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 5px;
        width: 7px;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 0 4px rgba(0, 0, 0, .35);
    }

    .staff .blk {
        position: absolute;
        left: 0;
        width: 100%;
        background: #1b1f24;
    }

    .staff .blk.half {
        width: 55%;
    }

    .staff .lbl {
        position: absolute;
        left: 15px;
        transform: translateY(50%);
        font-size: 9px;
        font-size: clamp(8px, 3.8cqmin, 11px);
        font-weight: 600;
        color: rgba(255, 255, 255, .85);
        text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
        font-variant-numeric: tabular-nums;
    }

    .staff .mark {
        position: absolute;
        left: 0;
        width: 16px;
        height: 0;
        border-top: 2px solid #ffd447;
        transform: translateY(1px);
        transition: bottom 1.4s cubic-bezier(.25, .8, .25, 1);
    }

    /* ---------- Kennwert-Linien und Verlauf ---------- */
    .refs, .history {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: var(--pad-left);
        pointer-events: none;
    }

    .ref {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px dashed rgba(255, 255, 255, .45);
        transition: bottom 1.4s cubic-bezier(.25, .8, .25, 1);
    }

    .ref.warnline {
        border-top: 1px solid rgba(255, 110, 110, .9);
    }

    .ref span {
        position: absolute;
        right: 6px;
        bottom: 2px;
        font-size: 10px;
        font-size: clamp(9px, 4.2cqmin, 12px);
        font-weight: 600;
        letter-spacing: .04em;
        color: rgba(255, 255, 255, .8);
        text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
    }

    .ref span.l {
        bottom: auto;
        top: 2px;
    }

    .history svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .history polyline {
        fill: none;
        stroke: rgba(255, 255, 255, .55);
        stroke-width: 1.6;
        stroke-linejoin: round;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
    }

    /* ---------- Inhalt ---------- */
    .content {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: 12px 14px;
        padding: var(--hdr) clamp(10px, 7cqmin, 24px) clamp(8px, 6cqmin, 20px) calc(var(--pad-left) + clamp(8px, 5cqmin, 20px));
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
    }

    /* Den Namen zeigt Symcon in der Kopfzeile der Kachel – hier nur das Gewässer */
    .station {
        display: none;
        font-size: 14px;
        font-size: clamp(11px, 7cqmin, 20px);
        font-weight: 650;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-transform: capitalize;
    }

    .waterbody {
        font-size: 11px;
        font-size: clamp(9px, 5cqmin, 14px);
        opacity: .75;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-transform: capitalize;
    }

    .main {
        display: flex;
        align-items: baseline;
        gap: .35em;
        flex-wrap: wrap;
    }

    .level {
        font-size: 36px;
        font-size: clamp(22px, 21cqmin, 72px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -.02em;
        font-variant-numeric: tabular-nums;
    }

    .unit {
        font-size: 14px;
        font-size: clamp(11px, 7cqmin, 22px);
        font-weight: 600;
        opacity: .85;
    }

    .chip {
        display: inline-flex;
        align-items: center;
        gap: .3em;
        padding: .2em .6em;
        border-radius: 999px;
        background: rgba(0, 0, 0, .28);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        font-size: 11px;
        font-size: clamp(9px, 5cqmin, 14px);
        font-weight: 600;
        white-space: nowrap;
        text-shadow: none;
    }

    .arrow {
        display: inline-block;
        transition: transform .6s;
    }

    .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 6px;
        font-size: 11px;
        font-size: clamp(9px, 5cqmin, 14px);
    }

    .bottom .left, .bottom .right {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .bottom .right {
        align-items: flex-end;
        text-align: right;
    }

    .muted {
        opacity: .8;
    }

    .badge {
        display: none;
        padding: .15em .55em;
        border-radius: 6px;
        background: #fff;
        color: #c62828;
        font-weight: 700;
        text-shadow: none;
        animation: pulse 1.6s ease-in-out infinite;
    }

    .badge.show {
        display: inline-block;
    }

    .badge.info {
        background: rgba(0, 0, 0, .4);
        color: #fff;
        animation: none;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: .55; }
    }

    /* ---------- Detailansicht ---------- */
    .detail {
        position: absolute;
        inset: 0;
        z-index: 10;
        box-sizing: border-box;
        padding: clamp(8px, 5cqmin, 18px);
        padding-top: calc(var(--hdr) + 6px);
        display: flex;
        flex-direction: column;
        gap: clamp(4px, 2.5cqmin, 10px);
        background: rgba(7, 15, 25, .95);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transform: scale(.98);
        transition: opacity .3s, transform .3s;
        cursor: default;
    }

    .detail.open {
        opacity: 1;
        pointer-events: auto;
        transform: none;
    }

    .d-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: clamp(11px, 6cqmin, 18px);
        font-weight: 650;
        text-transform: capitalize;
    }

    .d-head small {
        font-weight: 400;
        opacity: .65;
        font-size: .8em;
        text-transform: none;
    }

    .d-close {
        flex: none;
        width: 1.6em;
        height: 1.6em;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, .12);
        color: #fff;
        font-size: inherit;
        line-height: 1;
        cursor: pointer;
    }

    .d-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        font-size: clamp(9px, 4.4cqmin, 13px);
    }

    .d-stats div {
        min-width: 0;
        overflow: hidden;
        background: rgba(255, 255, 255, .06);
        border-radius: 8px;
        padding: .35em .5em;
    }

    .d-stats b {
        display: block;
        font-size: 1.15em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .d-stats span {
        opacity: .6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
    }

    .d-chart {
        position: relative;
        flex: 1;
        min-height: 40px;
        margin-left: 34px;
        margin-bottom: 16px;
    }

    .d-chart svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .d-chart .grid {
        stroke: rgba(255, 255, 255, .1);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
    }

    .d-chart .line {
        fill: none;
        stroke: #5fb4ff;
        stroke-width: 2;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
    }

    .d-chart .area {
        fill: url(#dArea);
    }

    .d-chart .refline {
        stroke: rgba(255, 255, 255, .45);
        stroke-dasharray: 4 3;
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
    }

    .d-chart .refline.warn {
        stroke: rgba(255, 110, 110, .9);
        stroke-dasharray: none;
    }

    .d-y, .d-x, .d-r {
        position: absolute;
        font-size: clamp(8px, 3.6cqmin, 11px);
        opacity: .65;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .d-y {
        right: calc(100% + 6px);
        transform: translateY(50%);
    }

    .d-x {
        top: calc(100% + 3px);
        transform: translateX(-50%);
    }

    .d-x.first { transform: none; }
    .d-x.last  { transform: translateX(-100%); }

    .d-r {
        right: 2px;
        opacity: .8;
        transform: translateY(-2px);
    }

    .d-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: .6;
        font-size: clamp(10px, 5cqmin, 14px);
    }


    /* ---------- Farbschemas ---------- */
    #tile.theme-dark  { --sky1: #070f19; --sky2: #132538; }
    #tile.theme-light { --sky1: #cfe6f5; --sky2: #f1f8fd; color: #12304a; }
    #tile.theme-light .content { text-shadow: 0 0 6px rgba(255, 255, 255, .9), 0 0 2px rgba(255, 255, 255, .9); }
    #tile.theme-light .ref { border-top-color: rgba(18, 48, 74, .45); }
    #tile.theme-light .ref span, #tile.theme-light .staff .lbl { color: #12304a; text-shadow: 0 0 4px rgba(255, 255, 255, .9); }
    #tile.theme-light .chip { background: rgba(255, 255, 255, .6); color: #12304a; }
    #tile.theme-light .history polyline { stroke: rgba(18, 48, 74, .45); }
    #tile.theme-dark .stars { opacity: 1; }

    /* ---------- eigenes Hintergrundbild ---------- */
    .bg, .bgdim {
        position: absolute;
        inset: 0;
        display: none;
        pointer-events: none;
    }

    .bg {
        background-size: cover;
        background-position: center;
    }

    .bgdim {
        background: #000;
    }

    #tile.has-bg .bg, #tile.has-bg .bgdim { display: block; }
    #tile.has-bg .stars, #tile.has-bg .sun, #tile.has-bg .moon, #tile.has-bg .clouds,
    #tile.layout-ring .sun, #tile.layout-ring .moon { display: none !important; }
    #tile.has-bg .water { opacity: .8; }

    /* ---------- Sonne, Mond, Wolken ---------- */
    .sun, .moon {
        position: absolute;
        display: none;
        width: clamp(18px, 10cqmin, 42px);
        height: clamp(18px, 10cqmin, 42px);
        transform: translate(-50%, -50%);
        pointer-events: none;
        transition: left 2s, top 2s;
    }

    /* Sonne: heller Kern, weiche Korona, langsam drehende Strahlen */
    .sun {
        border-radius: 50%;
        background: radial-gradient(circle, #fffef6 0%, #fff6d2 38%, #ffe08a 62%, #ffc94d 78%, rgba(255, 196, 77, 0) 80%);
        filter: drop-shadow(0 0 6px rgba(255, 230, 160, .9));
    }

    .sun::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 520%;
        height: 520%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 244, 205, .55) 0%, rgba(255, 226, 150, .22) 18%, rgba(255, 214, 120, .08) 38%, rgba(255, 210, 110, 0) 62%);
        pointer-events: none;
    }

    .sun::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300%;
        height: 300%;
        margin: -150% 0 0 -150%;
        border-radius: 50%;
        background: repeating-conic-gradient(from 0deg, rgba(255, 246, 214, .55) 0deg 3deg, rgba(255, 246, 214, 0) 3deg 15deg);
        -webkit-mask: radial-gradient(circle, transparent 30%, #000 36%, rgba(0, 0, 0, .35) 55%, transparent 70%);
        mask: radial-gradient(circle, transparent 30%, #000 36%, rgba(0, 0, 0, .35) 55%, transparent 70%);
        opacity: .3;
        filter: blur(.6px);
        animation: sunspin 120s linear infinite;
        pointer-events: none;
    }

    @keyframes sunspin {
        to { transform: rotate(360deg); }
    }

    #tile.sky-dusk .sun {
        background: radial-gradient(circle, #fff3e2 0%, #ffd2a1 40%, #ff9c5a 66%, #f0703a 78%, rgba(240, 112, 58, 0) 80%);
        filter: drop-shadow(0 0 8px rgba(255, 150, 90, .9));
    }

    #tile.sky-dusk .sun::before {
        background: radial-gradient(circle, rgba(255, 190, 140, .55) 0%, rgba(255, 150, 100, .22) 20%, rgba(255, 130, 90, 0) 62%);
    }

    .moon svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 0 8px rgba(255, 250, 220, .45));
    }

    #tile.show-sun .sun, #tile.show-moon .moon { display: block; }

    .clouds {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--hdr);
        height: 55%;
        overflow: hidden;
        pointer-events: none;
        display: none;
    }

    #tile.show-clouds .clouds { display: block; }

    /* Wolken: einmal berechnete weiche Form (Maske), eingefärbt mit Licht von oben */
    .cloud {
        position: absolute;
        left: -40%;
        width: 36%;
        aspect-ratio: 2.4;
        animation: cloud linear infinite;
        background: linear-gradient(180deg, var(--cl1) 0%, var(--cl1) 30%, var(--cl2) 62%, var(--cl3) 100%);
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
    }

    .cloud.far {
        width: 24%;
        opacity: .55;
    }

    #tile { --cl1: rgba(255, 255, 255, .96); --cl2: rgba(236, 241, 248, .88); --cl3: rgba(196, 206, 220, .7); }
    #tile.sky-dusk { --cl1: rgba(255, 222, 200, .9); --cl2: rgba(236, 168, 150, .7); --cl3: rgba(160, 110, 130, .55); }
    #tile.sky-night, #tile.theme-dark { --cl1: rgba(160, 175, 200, .42); --cl2: rgba(120, 135, 160, .3); --cl3: rgba(80, 92, 115, .22); }
    #tile.theme-symcon:not(.sym-light) { --cl1: rgba(255, 255, 255, .62); --cl2: rgba(225, 230, 240, .42); --cl3: rgba(170, 180, 195, .26); }
    #tile.theme-symcon.night:not(.sym-light) { --cl1: rgba(190, 200, 220, .38); --cl2: rgba(150, 160, 185, .26); --cl3: rgba(110, 120, 145, .18); }
    #tile.theme-symcon.sym-light { --cl1: rgba(190, 200, 214, .75); --cl2: rgba(165, 176, 192, .6); --cl3: rgba(135, 146, 165, .45); }
    #tile.theme-light { --cl1: rgba(255, 255, 255, 1); --cl2: rgba(240, 245, 250, .95); --cl3: rgba(205, 215, 228, .8); }

    @keyframes cloud {
        from { transform: translateX(0); }
        to   { transform: translateX(420%); }
    }

    /* ---------- Schiff: modernes Binnenschiff, fährt langsam flussabwärts ---------- */
    .boat {
        position: absolute;
        bottom: calc(100% - clamp(5px, 2cqmin, 9px));
        left: 70%;
        width: clamp(64px, 30cqmin, 150px);
        display: none;
        pointer-events: none;
        animation: sail 140s linear infinite;
        animation-delay: -60s;
    }

    #tile.show-boat .boat { display: block; }

    .boat .hull {
        animation: bob calc(var(--wspeed) / 1.6) ease-in-out infinite;
        transform-origin: 50% 90%;
    }

    .boat svg {
        width: 100%;
        display: block;
        overflow: visible;
    }

    /* Bugwelle und Kielwasser */
    .boat .wake {
        position: absolute;
        bottom: -2px;
        left: 92%;
        width: 120%;
        height: 7px;
        background: linear-gradient(90deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .25) 35%, rgba(255, 255, 255, 0));
        -webkit-mask: repeating-linear-gradient(90deg, #000 0 10px, rgba(0, 0, 0, .35) 10px 16px);
        mask: repeating-linear-gradient(90deg, #000 0 10px, rgba(0, 0, 0, .35) 10px 16px);
        border-radius: 50%;
        opacity: .8;
        animation: wake 1.6s linear infinite;
    }

    .boat .bow {
        position: absolute;
        bottom: -2px;
        left: -4%;
        width: 14%;
        height: 6px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 70% 50%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 70%);
        animation: bowwave 1.2s ease-in-out infinite;
    }

    @keyframes wake {
        from { -webkit-mask-position: 0 0; mask-position: 0 0; }
        to   { -webkit-mask-position: 16px 0; mask-position: 16px 0; }
    }

    @keyframes bowwave {
        0%, 100% { transform: scaleX(1); opacity: .9; }
        50%      { transform: scaleX(1.25); opacity: .6; }
    }

    @keyframes sail {
        from { left: 108%; }
        to   { left: -45%; }
    }

    @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-.8deg); }
        50%      { transform: translateY(1.5px) rotate(.8deg); }
    }

    @keyframes bob-calm {
        0%, 100% { transform: translateY(0) rotate(-.4deg); }
        50%      { transform: translateY(1px) rotate(.4deg); }
    }

    /* Vor Anker: Schiff liegt still, kein Kielwasser, Ankerkette sichtbar */

    #tile.anchored .boat { animation: none; left: 62%; }

    #tile.anchored .boat .anchor { display: inline; }
    #tile.anchored .boat .wake, #tile.anchored .boat .bow { display: none; }

    /* Nachts: Licht im Steuerhaus, Positionslichter */

    #tile.sky-night .boat .win, #tile.theme-dark .boat .win, #tile.night .boat .win { fill: #ffd27a; }

        height: 100%;

        display: none;

    #tile.sym-light, #tile.theme-light { --fish: rgba(0, 60, 90, .22); }
    #tile.st-warn { --fish: rgba(60, 0, 10, .3); }

    /* ---------- Lichtspiel im Wasser ---------- */
    .caustics {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        opacity: .22;
        mix-blend-mode: soft-light;
    }

    .caustics::before, .caustics::after {
        content: "";
        position: absolute;
        inset: -50%;
        background:
            radial-gradient(ellipse 18% 9% at 20% 30%, rgba(255, 255, 255, .9), transparent 70%),
            radial-gradient(ellipse 14% 7% at 65% 22%, rgba(255, 255, 255, .8), transparent 70%),
            radial-gradient(ellipse 20% 8% at 45% 60%, rgba(255, 255, 255, .7), transparent 70%),
            radial-gradient(ellipse 12% 6% at 85% 55%, rgba(255, 255, 255, .8), transparent 70%),
            radial-gradient(ellipse 16% 7% at 10% 75%, rgba(255, 255, 255, .7), transparent 70%);
        animation: caustic 18s ease-in-out infinite alternate;
    }

    .caustics::after {
        animation-duration: 26s;
        animation-direction: alternate-reverse;
        opacity: .7;
    }

    @keyframes caustic {
        from { transform: translate(-6%, -3%) rotate(0deg) scale(1); }
        to   { transform: translate(6%, 3%) rotate(8deg) scale(1.1); }
    }

    .water .body::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, .08) 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 20, 40, .28) 100%);

    .chips {
        display: flex;

        font-size: 11px;
        font-size: clamp(9px, 4.6cqmin, 13px);

    /* ---------- Pegel-Ring ---------- */
    .ring {
        position: absolute;
        inset: var(--hdr) 0 0 0;
        display: none;
        align-items: center;
        justify-content: center;
    }

    #tile.layout-ring .ring { display: flex; }

    #tile.layout-ring .staff, #tile.layout-ring .content, #tile.layout-ring .rain { display: none; }

    .ring .track {

    .ring .prog {

    }

    .ring .rwater {

    .ring .rwave {

    /* ---------- Symcon-Design: Farben und Schrift der gewählten Visualisierung ---------- */
    #tile.theme-symcon {
        --sky1: transparent;
        --sky2: transparent;
        color: var(--content-color, #fff);
    }

    #tile.theme-symcon:not(.st-low):not(.st-high):not(.st-warn):not(.st-nodata) {

    (function () {
        var nf0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });

        function T(s) {
            try {
                return typeof window.translate === 'function' ? window.translate(s) : s;
            } catch (e) {
                return s;
            }
        }

        // „Uhr“ hinter der Uhrzeit nur, wenn die Sprache es vorsieht (Deutsch); Englisch zeigt nur die Zeit
        function clockSuffix() {
            var u = T('o\'clock');
            return u === 'o\'clock' ? '' : ' ' + u;
        }

        function translateStatic(root) {
            Array.prototype.forEach.call(root.querySelectorAll('[data-t]'), function (el) {
                el.textContent = T(el.getAttribute('data-t'));
            });
        }

        // Texte aus PEGELONLINE nie ungefiltert als HTML einsetzen
        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function fmtLevel(v) {
            return Math.abs(v - Math.round(v)) < 0.05 ? nf0.format(v) : nf1.format(v);
        }

        function fmtTime(ts) {
            var d = new Date(ts * 1000);
            var now = new Date();
            var time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            if (d.toDateString() === now.toDateString()) {
                return time + clockSuffix();
            }
            return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ', ' + time + clockSuffix();
        }

        function fmtAxisTime(ts, spanHours) {
            var d = new Date(ts * 1000);
            if (spanHours > 48) {
                return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
            }
            return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }

        function signed(v) {
            return (v > 0 ? '+' : '') + nf1.format(v);
        }

        // ---------- Sonnenstand (vereinfachte Berechnung, genau genug für die Darstellung) ----------
        function sunPosition(lat, lon, ms) {
            var rad = Math.PI / 180;
            var d = ms / 86400000 + 2440587.5 - 2451545.0;
            var g = (357.529 + 0.98560028 * d) * rad;
            var q = 280.459 + 0.98564736 * d;
            var L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
            var e = (23.439 - 0.00000036 * d) * rad;
            var ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
            var dec = Math.asin(Math.sin(e) * Math.sin(L));
            var gmst = (18.697374558 + 24.06570982441908 * d) % 24;
            var ha = (gmst * 15 + lon) * rad - ra;
            var phi = lat * rad;
            var alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(ha));
            // Azimut von Süden aus, negativ = Osten
            var az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
            return { alt: alt / rad, az: az / rad };
        }

        // ---------- Mondphase: 0 = Neumond, 0,5 = Vollmond ----------
        function moonPhase(ms) {
            var days = ms / 86400000 - 10962.76; // Neumond am 6.1.2000, 18:14 UTC
            var p = (days / 29.530588853) % 1;
            return p < 0 ? p + 1 : p;
        }

        function moonPath(p) {
            var r = 10;
            var k = Math.cos(2 * Math.PI * p);       // 1 = neu, -1 = voll
            var rx = Math.abs(k) * r;
            var waxing = p < 0.5;
            var crescent = k > 0;
            if (waxing) {
                return 'M0 ' + (-r) + ' A' + r + ' ' + r + ' 0 0 1 0 ' + r + ' A' + rx.toFixed(2) + ' ' + r + ' 0 0 ' + (crescent ? 0 : 1) + ' 0 ' + (-r) + ' Z';
            }
            return 'M0 ' + (-r) + ' A' + r + ' ' + r + ' 0 0 0 0 ' + r + ' A' + rx.toFixed(2) + ' ' + r + ' 0 0 ' + (crescent ? 1 : 0) + ' 0 ' + (-r) + ' Z';
        }

        // Himmel: liefert die Klassen für Schema, Tageszeit und Himmelskörper
        function skyClasses(d) {
            var theme = d.theme || 0;
            var classes = [];
            var sky = d.sky !== false;
            var now = Date.now();

            if (theme === 3) {
                // Symcon-Design: kein eigener Himmel, nur Sonne bzw. Mond und Wolken
                classes.push('theme-symcon');
                var p3 = sunPosition(typeof d.lat === 'number' ? d.lat : 51.0, typeof d.lon === 'number' ? d.lon : 10.0, now);
                if (p3.alt <= -6) classes.push('night');
                if (sky) {
                    classes.push('show-clouds');
                    if (p3.alt > -3) {
                        classes.push('show-sun');
                        $('sun').style.left = (50 + Math.max(-1, Math.min(1, p3.az / 110)) * 40).toFixed(1) + '%';
                        $('sun').style.top = (44 - Math.max(0, Math.min(55, p3.alt)) / 55 * 34).toFixed(1) + '%';
                    } else {
                        classes.push('show-moon');
                        placeMoon(now);
                    }
                }
                return classes;
            }
            if (theme === 1) {
                classes.push('theme-dark');
                if (sky) classes.push('show-moon', 'show-clouds');
                placeMoon(now);
                return classes;
            }
            if (theme === 2) {
                classes.push('theme-light');
                if (sky) {
                    classes.push('show-sun', 'show-clouds');
                    $('sun').style.left = '80%';
                    $('sun').style.top = '16%';
                }
                return classes;
            }

            // Natur: Himmel nach Sonnenstand am Ort der Station
            var lat = typeof d.lat === 'number' ? d.lat : 51.0;
            var lon = typeof d.lon === 'number' ? d.lon : 10.0;
            var pos = sunPosition(lat, lon, now);
            classes.push(pos.alt > 6 ? 'sky-day' : (pos.alt > -6 ? 'sky-dusk' : 'sky-night'));
            if (sky) {
                classes.push('show-clouds');
                if (pos.alt > -3) {
                    classes.push('show-sun');
                    var x = 50 + Math.max(-1, Math.min(1, pos.az / 110)) * 40;
                    var y = 44 - Math.max(0, Math.min(55, pos.alt)) / 55 * 34;
                    $('sun').style.left = x.toFixed(1) + '%';
                    $('sun').style.top = y.toFixed(1) + '%';
                } else {
                    classes.push('show-moon');
                    placeMoon(now);
                }
            }
            return classes;
        }

        function placeMoon(now) {
            $('moonLit').setAttribute('d', moonPath(moonPhase(now)));
            $('moon').style.left = '74%';
            $('moon').style.top = '15%';
        }

        // ---------- einmalige Deko: Sterne, Wolken, Strömung, Regen ----------
        function buildDecor() {
            var s = '';
            for (var i = 0; i < 40; i++) {
                var size = Math.random() < 0.2 ? 3 : 2;
                s += '<span class="star" style="left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 60).toFixed(1) +
                    '%;width:' + size + 'px;height:' + size + 'px;animation-delay:' + (Math.random() * 3).toFixed(2) + 's"></span>';
            }
            $('stars').innerHTML = s;

            // Wolken: Haufenwolke aus vielen weichen Tupfen auf einer Canvas, als Maske verwendet
            function cloudMask(seed) {
                var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
                var W = 360, H = 150;
                var cv = document.createElement('canvas');
                cv.width = W;
                cv.height = H;
                var g = cv.getContext('2d');
                // Grundform: flache Unterkante, ein bis zwei Türme oben
                var towers = [0.35 + rnd() * 0.15, 0.6 + rnd() * 0.2];
                for (var k = 0; k < 170; k++) {
                    var x = 0.08 + rnd() * 0.84;
                    var hump = Math.max(
                        Math.exp(-Math.pow((x - towers[0]) / 0.17, 2)),
                        0.75 * Math.exp(-Math.pow((x - towers[1]) / 0.15, 2))
                    );
                    var edge = Math.sin(Math.PI * (x - 0.08) / 0.84);
                    var top = 0.78 - (0.25 + 0.5 * hump) * edge;      // Oberkante (0 = oben)
                    var y = top + rnd() * (0.82 - top);
                    var r = (10 + rnd() * 26) * (0.55 + 0.6 * edge);
                    var px = x * W, py = y * H;
                    var gr = g.createRadialGradient(px, py, 0, px, py, r);
                    gr.addColorStop(0, 'rgba(0,0,0,0.20)');
                    gr.addColorStop(0.6, 'rgba(0,0,0,0.08)');
                    gr.addColorStop(1, 'rgba(0,0,0,0)');
                    g.fillStyle = gr;
                    g.beginPath();
                    g.arc(px, py, r, 0, Math.PI * 2);
                    g.fill();
                }
                // Unterseite glätten
                var cut = g.createLinearGradient(0, H * 0.72, 0, H * 0.9);
                cut.addColorStop(0, 'rgba(0,0,0,1)');
                cut.addColorStop(1, 'rgba(0,0,0,0)');
                g.globalCompositeOperation = 'destination-in';
                g.fillStyle = cut;
                g.fillRect(0, 0, W, H);
                return cv.toDataURL();
            }

            function cloud(cls, top, dur, delay, seed) {
                var url = cloudMask(seed);
                return '<div class="cloud' + cls + '" style="top:' + top + '%;animation-duration:' + dur + 's;animation-delay:' + delay + 's;' +
                    '-webkit-mask-image:url(' + url + ');mask-image:url(' + url + ')"></div>';
            }
            var cl = cloud(' far', 2, 240, -40, 11) + cloud(' far', 14, 280, -180, 23) + cloud('', 8, 160, -25, 37) + cloud('', 24, 200, -120, 51);
            $('clouds').innerHTML = cl;

            var c = '';
            for (var j = 0; j < 9; j++) {
                c += '<i style="top:' + (8 + j * 10 + Math.random() * 4).toFixed(1) + '%;animation-delay:' + (Math.random() * 2.6).toFixed(2) +
                    's;animation-duration:' + (2 + Math.random() * 1.4).toFixed(2) + 's"></i>';
            }
            $('current').innerHTML = c;

            var r = '';
            for (var k = 0; k < 45; k++) {
                r += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;animation-delay:' + (Math.random() * 0.9).toFixed(2) +
                    's;animation-duration:' + (0.6 + Math.random() * 0.5).toFixed(2) + 's"></i>';
            }
            $('rain').innerHTML = r;

            if (background) {
                $('bg').style.backgroundImage = 'url("' + background + '")';
            }
        }

        // Dunkle Schriftfarbe der Visualisierung = helles Design
        function isDarkText(el) {
            var m = getComputedStyle(el).color.match(/\d+(\.\d+)?/g);
            if (!m || m.length < 3) return false;
            var lum = (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255;
            return lum < 0.5;
        }

        // ---------- Fischschwarm (Canvas) ----------
        var fish = { on: false, raf: 0, list: [], t: 0, last: 0, color: 'rgba(0, 38, 60, .3)' };

        function initFish() {
            fish.list = [];
            var n = 14;
            for (var i = 0; i < n; i++) {
                fish.list.push({
                    ox: (Math.random() - 0.5) * 0.22,       // Lage im Schwarm (relativ)
                    oy: (Math.random() - 0.5) * 0.16,
                    x: 0.5, y: 0.5, a: 0,
                    size: 0.75 + Math.random() * 0.5,
                    phase: Math.random() * Math.PI * 2,
                    lag: 0.02 + Math.random() * 0.03
                });
            }
        }

        function drawFish(ts) {
            var c = $('fish');
            if (!fish.on || !c) return;
            fish.raf = requestAnimationFrame(drawFish);
            // 30 Bilder pro Sekunde reichen für ruhige Fische und schonen Wandtablets
            if (fish.last && ts - fish.last < 32) return;
            var dt = fish.last ? Math.min(0.08, (ts - fish.last) / 1000) : 0.033;
            fish.last = ts;
            fish.t += dt;

            var dpr = window.devicePixelRatio || 1;
            var w = c.clientWidth, h = c.clientHeight;
            if (w < 40 || h < 40) return;
            if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
                c.width = Math.round(w * dpr);
                c.height = Math.round(h * dpr);
            }
            var ctx = c.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            // Leitpunkt des Schwarms: ruhige Schleifen im mittleren Wasser
            var t = fish.t;
            var cx = 0.5 + 0.36 * Math.sin(t * 0.09) + 0.06 * Math.sin(t * 0.31);
            var cy = 0.55 + 0.14 * Math.sin(t * 0.13 + 1.3);
            var scale = Math.max(0.6, Math.min(1.4, Math.min(w, h * 2) / 360));
            var dark = fish.color;

            fish.list.forEach(function (f, i) {
                var tx = cx + f.ox * (1 + 0.3 * Math.sin(t * 0.5 + i));
                var ty = cy + f.oy * (1 + 0.3 * Math.cos(t * 0.4 + i));
                var dx = tx - f.x, dy = ty - f.y;
                f.x += dx * (f.lag * 60 * dt);
                f.y += dy * (f.lag * 60 * dt);
                var ang = Math.atan2(dy * h, dx * w);
                if (Math.abs(dx) + Math.abs(dy) > 0.0005) {
                    var d = ang - f.a;
                    while (d > Math.PI) d -= 2 * Math.PI;
                    while (d < -Math.PI) d += 2 * Math.PI;
                    f.a += d * Math.min(1, dt * 4);
                }
                var px = f.x * w, py = Math.max(0.2, Math.min(0.92, f.y)) * h;
                var len = 7 * f.size * scale, hgt = 2.4 * f.size * scale;
                var wig = Math.sin(t * 9 + f.phase) * 0.35;

                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(f.a);
                ctx.fillStyle = dark;
                // Körper
                ctx.beginPath();
                ctx.ellipse(0, 0, len, hgt, 0, 0, Math.PI * 2);
                ctx.fill();
                // Schwanzflosse
                ctx.beginPath();
                ctx.moveTo(-len * 0.85, 0);
                ctx.lineTo(-len * 1.55, -hgt * (1.1 + wig));
                ctx.lineTo(-len * 1.55, hgt * (1.1 - wig));
                ctx.closePath();
                ctx.fill();
                // Lichtreflex auf dem Rücken
                ctx.fillStyle = 'rgba(255, 255, 255, .18)';
                ctx.beginPath();
                ctx.ellipse(len * 0.1, -hgt * 0.35, len * 0.55, hgt * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function setFish(on) {
            if (on === fish.on) return;
            fish.on = on;
            if (on) {
                if (!fish.list.length) initFish();
                fish.last = 0;
                fish.raf = requestAnimationFrame(drawFish);
            } else if (fish.raf) {
                cancelAnimationFrame(fish.raf);
                fish.raf = 0;
            }
        }

        // ---------- Wert hochzählen ----------
        function countTo(target, el, ringEl) {
            if (countAnim) cancelAnimationFrame(countAnim);
            var from = shownLevel === null ? target : shownLevel;
            var start = null;
            var dur = Math.abs(target - from) < 0.05 ? 0 : 1200;
            function step(ts) {
                if (start === null) start = ts;
                var t = dur === 0 ? 1 : Math.min(1, (ts - start) / dur);
                var e = 1 - Math.pow(1 - t, 3);
                var v = from + (target - from) * e;
                var txt = t < 1 ? nf0.format(v) : fmtLevel(target);
                el.textContent = txt;
                ringEl.textContent = txt;
                if (t < 1) {
                    countAnim = requestAnimationFrame(step);
                } else {
                    shownLevel = target;
                    countAnim = null;
                }
            }
            countAnim = requestAnimationFrame(step);
        }

        // ---------- Pegel-Ring ----------
        function useRing(d) {
            var layout = d.layout || 0;
            if (layout === 1) return false;
            if (layout === 2) return true;
            var t = $('tile');
            return t.clientWidth < 190 && t.clientHeight < 190;
        }

        function renderRing(d) {
            var refs = d.scaleRefs || {};
            var hist = Array.isArray(d.history) ? d.history.map(function (p) { return p[1]; }) : [];
            var lo = typeof refs.MNW === 'number' ? refs.MNW : (hist.length ? Math.min.apply(null, hist) - 20 : d.level - 50);
            var hi = typeof refs.HSW === 'number' ? refs.HSW : (typeof refs.MHW === 'number' ? refs.MHW : (hist.length ? Math.max.apply(null, hist) + 20 : d.level + 50));
            if (hi - lo < 10) hi = lo + 10;
            var frac = Math.max(0, Math.min(1, (d.level - lo) / (hi - lo)));

            // Bogen über 270°
            var circ = 2 * Math.PI * 45;
            var arc = circ * 0.75;
            var prog = $('rprog');
            prog.setAttribute('stroke-dasharray', arc.toFixed(1) + ' ' + circ.toFixed(1));
            prog.setAttribute('stroke-dashoffset', (arc * (1 - frac)).toFixed(1));
            $('rprog').style.strokeDasharray = arc.toFixed(1) + ' ' + circ.toFixed(1);

            // Wasserspiegel im Kreis (Kreis reicht von y=12 bis y=88)
            var y = 88 - frac * 76;
            $('rwater').style.transform = 'translate(-20px,' + y.toFixed(1) + 'px)';

            $('rname').textContent = '';
            $('rtrend').textContent = d.trend > 0 ? '↗' : (d.trend < 0 ? '↘' : (typeof d.trend === 'number' ? '→' : ''));
        }

        // ---------- Skala ----------
        function makeScale(d) {
            var values = [];
            if (typeof d.level === 'number') values.push(d.level);
            var refs = d.refs || {};
            Object.keys(refs).forEach(function (k) { values.push(refs[k]); });
            (Array.isArray(d.history) ? d.history : []).forEach(function (p) { values.push(p[1]); });

            var lo = Math.min.apply(null, values.length ? values : [0]);
            var hi = Math.max.apply(null, values.length ? values : [100]);
            var span = Math.max(hi - lo, 20);
            lo -= span * 0.25;
            hi += span * 0.25;

            // Der Wertebereich lo..hi liegt bei 18–82 % der Kachelhöhe
            return {
                raw: function (v) { return 18 + (v - lo) / (hi - lo) * 64; },
                pct: function (v) { return Math.max(0, Math.min(100, 18 + (v - lo) / (hi - lo) * 64)); },
                valueAt: function (p) { return lo + (p - 18) / 64 * (hi - lo); }
            };
        }

        function niceStep(range, targetTicks) {
            var raw = range / targetTicks;
            var steps = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
            for (var i = 0; i < steps.length; i++) {
                if (steps[i] >= raw) return steps[i];
            }
            return 2000;
        }

        // ---------- Pegellatte ----------
        function renderStaff(d, scale) {
            var bottomV = scale.valueAt(0), topV = scale.valueAt(100);
            var step = niceStep(topV - bottomV, 5);
            var half = step / 2;
            var html = '<div class="bar">';
            // abwechselnde Blöcke wie bei einer echten Pegellatte
            var startBlk = Math.floor(bottomV / half) * half;
            for (var v = startBlk, i = Math.round(startBlk / half); v < topV; v += half, i++) {
                if (i % 2 === 0) {
                    var b = scale.raw(v), t = scale.raw(v + half);
                    html += '<div class="blk' + (i % 4 === 0 ? '' : ' half') + '" style="bottom:' + b.toFixed(2) + '%;height:' + (t - b).toFixed(2) + '%"></div>';
                }
            }
            html += '</div>';
            var start = Math.ceil(bottomV / step) * step;
            for (var m = start; m <= topV; m += step) {
                var p = scale.raw(m);
                if (p > 4 && p < 96) {
                    html += '<span class="lbl" style="bottom:' + p.toFixed(2) + '%">' + nf0.format(Math.round(m) || 0) + '</span>';
                }
            }
            if (typeof d.level === 'number') {
                html += '<div class="mark" style="bottom:' + scale.pct(d.level).toFixed(2) + '%"></div>';
            }
            $('staff').innerHTML = html;
        }

        // ---------- Detailansicht ----------
        function renderDetail(d) {
            var hist = Array.isArray(d.history) ? d.history : [];
            $('dTitle').textContent = d.station ? d.station.toLowerCase() : T('Water level');
            $('dOpen').style.display = (typeof window.openObject === 'function' && d.openId) ? '' : 'none';
            $('dNow').textContent = typeof d.level === 'number' ? nf0.format(d.level) + ' cm' : '–';

            var chart = $('dChart');
            if (hist.length < 2) {
                $('dRange').textContent = '';
                $('dMin').textContent = $('dMax').textContent = $('dDelta').textContent = '–';
                chart.innerHTML = '<div class="d-empty">' + T('No history available – enable the history line in the instance.') + '</div>';
                return;
            }

            var vals = hist.map(function (p) { return p[1]; });
            var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
            var t0 = hist[0][0], t1 = hist[hist.length - 1][0];
            var spanH = (t1 - t0) / 3600;
            $('dRange').textContent = T('last') + ' ' + (spanH >= 48 ? Math.round(spanH / 24) + ' ' + T('days') : Math.round(spanH) + ' ' + T('h'));
            $('dMin').textContent = nf0.format(min) + ' cm';
            $('dMax').textContent = nf0.format(max) + ' cm';
            $('dDelta').textContent = signed(vals[vals.length - 1] - vals[0]) + ' cm';

            // y-Bereich: Verlauf plus Kennwerte in der Nähe
            var refs = d.refs || {};
            var lo = min, hi = max;
            var pad = Math.max((max - min) * 0.15, 5);
            Object.keys(refs).forEach(function (k) {
                if (refs[k] >= min - (max - min + 20) && refs[k] <= max + (max - min + 20)) {
                    lo = Math.min(lo, refs[k]);
                    hi = Math.max(hi, refs[k]);
                }
            });
            lo -= pad;
            hi += pad;
            var step = niceStep(hi - lo, 4);
            lo = Math.floor(lo / step) * step;
            hi = Math.ceil(hi / step) * step;

            var x = function (t) { return (t - t0) / Math.max(1, t1 - t0) * 100; };
            var y = function (v) { return 100 - (v - lo) / (hi - lo) * 100; };

            var pts = hist.map(function (p) { return x(p[0]).toFixed(2) + ',' + y(p[1]).toFixed(2); }).join(' ');
            var svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' +
                '<defs><linearGradient id="dArea" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0" style="stop-color:var(--accent-color,#5fb4ff)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--accent-color,#5fb4ff)" stop-opacity="0"/></linearGradient></defs>';
            var labels = '';
            for (var g = lo; g <= hi + 0.001; g += step) {
                svg += '<line class="grid" x1="0" x2="100" y1="' + y(g).toFixed(2) + '" y2="' + y(g).toFixed(2) + '"/>';
                labels += '<span class="d-y" style="bottom:' + (100 - y(g)).toFixed(2) + '%">' + nf0.format(g) + '</span>';
            }
            Object.keys(refs).forEach(function (k) {
                if (refs[k] >= lo && refs[k] <= hi) {
                    svg += '<line class="refline' + (k === 'Warnung' ? ' warn' : '') + '" x1="0" x2="100" y1="' + y(refs[k]).toFixed(2) + '" y2="' + y(refs[k]).toFixed(2) + '"/>';
                    labels += '<span class="d-r" style="bottom:' + (100 - y(refs[k])).toFixed(2) + '%">' + esc(k) + '</span>';
                }
            });
            svg += '<polygon class="area" points="0,100 ' + pts + ' 100,100"/>';
            svg += '<polyline class="line" points="' + pts + '"/></svg>';

            var ticks = [t0, t0 + (t1 - t0) / 2, t1];
            ticks.forEach(function (t, i) {
                labels += '<span class="d-x' + (i === 0 ? ' first' : (i === 2 ? ' last' : '')) + '" style="left:' + x(t).toFixed(2) + '%">' + fmtAxisTime(t, spanH) + '</span>';
            });

            chart.innerHTML = svg + labels;
        }

        // ---------- Hauptdarstellung ----------
        function render(d) {
            last = d;
            var tile = $('tile');
            var hasLevel = typeof d.level === 'number';
            var effects = d.effects !== false;

            $('station').textContent = d.station ? d.station.toLowerCase() : T('Water level');
            $('waterbody').textContent = d.water ? d.water.toLowerCase() : '\u00a0';
            if (hasLevel) {
                countTo(d.level, $('level'), $('rval'));
            } else {
                $('level').textContent = '–';
                $('rval').textContent = '–';
            }

            var scale = makeScale(d);
            $('water').style.height = (hasLevel ? scale.pct(d.level) : 35) + '%';

            // Kennwert-Linien
            var refs = d.refs || {};
            var refHtml = '';
            var keys = Object.keys(refs).sort(function (a, b) { return refs[a] - refs[b]; });
            var below = {};
            // Liegen zwei Linien dicht beieinander, kommt die Beschriftung der unteren unter ihre Linie
            for (var i = 1; i < keys.length; i++) {
                if (Math.abs(scale.pct(refs[keys[i]]) - scale.pct(refs[keys[i - 1]])) < 8 && !below[keys[i - 1]]) {
                    below[keys[i - 1]] = true;
                }
            }
            keys.forEach(function (k) {
                var p = scale.pct(refs[k]);
                refHtml += '<div class="ref' + (k === 'Warnung' ? ' warnline' : '') + '" style="bottom:' + p.toFixed(2) + '%"><span class="' + (below[k] ? 'l' : '') + '">' + esc(k) + ' ' + fmtLevel(Number(refs[k])) + '</span></div>';
            });
            $('refs').innerHTML = refHtml;

            // Verlaufslinie
            var hist = Array.isArray(d.history) ? d.history : [];
            if (hist.length > 1) {
                var t0 = hist[0][0], t1 = hist[hist.length - 1][0];
                var dt = Math.max(1, t1 - t0);
                $('hist').setAttribute('points', hist.map(function (p) {
                    return ((p[0] - t0) / dt * 100).toFixed(2) + ',' + (100 - scale.pct(p[1])).toFixed(2);
                }).join(' '));
            } else {
                $('hist').setAttribute('points', '');
            }

            // Pegellatte
            if (d.staff !== false && hasLevel) {
                renderStaff(d, scale);
            }

            // Tendenz
            var chip = $('trend');
            if (typeof d.trend === 'number') {
                chip.style.display = '';
                var rot = d.trend > 0 ? -45 : (d.trend < 0 ? 45 : 0);
                $('arrow').style.transform = 'rotate(' + rot + 'deg)';
                var txt = T(d.trend > 0 ? 'rising' : (d.trend < 0 ? 'falling' : 'steady'));
                if (typeof d.change === 'number') {
                    txt += ' · ' + signed(d.change) + ' cm / ' + d.trendHours + ' h';
                }
                $('trendtxt').textContent = txt;
            } else {
                chip.style.display = 'none';
            }

            // Prognose, Schifffahrt, Einordnung
            var fc = $('forecast');
            fc.style.display = d.forecast ? '' : 'none';
            fc.textContent = d.forecast ? '⏱ ' + d.forecast : '';
            $('ship').style.display = d.shipping === 'stopped' ? '' : 'none';
            $('insight').textContent = d.insight || '';

            // Strömung passend zur Tendenz
            var speed = 8, speed2 = 13, amp = 1;
            if (effects && d.trend > 0) { speed = 3.5; speed2 = 6; amp = 1.6; }
            if (effects && d.trend < 0) { speed = 12; speed2 = 18; amp = 0.8; }
            tile.style.setProperty('--wspeed', speed + 's');
            tile.style.setProperty('--wspeed2', speed2 + 's');
            tile.style.setProperty('--wamp', amp);

            // Zeit und Abfluss
            var stale = d.measuredAt && (Date.now() / 1000 - d.measuredAt) > 3 * 3600;
            $('time').textContent = d.measuredAt ? fmtTime(d.measuredAt) + (stale ? ' · ' + T('outdated') : '') : '';
            $('discharge').textContent = typeof d.discharge === 'number' ? T('Discharge') + ' ' + nf1.format(d.discharge) + ' m³/s' : '';

            // Zustand / Warnung / Fehler
            var badge = $('badge');
            badge.className = 'badge';
            if (d.error) {
                badge.textContent = d.error;
                badge.className = 'badge info show';
            } else if (d.warning) {
                badge.textContent = T('Flood');
                badge.className = 'badge show';
            }

            var state = 'st-nodata';
            if (hasLevel && !stale) {
                state = d.warning ? 'st-warn' : (d.state === 'high' ? 'st-high' : (d.state === 'low' ? 'st-low' : ''));
            }

            var classes = [state].concat(skyClasses(d));
            if (paused) classes.push('paused');
            if (d.calm) classes.push('calm');
            if (d.staff !== false && hasLevel) classes.push('with-staff');
            if (effects && d.trend > 0) classes.push('flow-up');
            if (effects && d.warning) classes.push('raining');
            if (d.boat !== false && hasLevel) classes.push('show-boat');
            var fishOn = d.fish !== false && hasLevel && !d.calm;
            if (fishOn) classes.push('show-fish');
            if (d.shipping === 'stopped') classes.push('anchored');
            if (background) classes.push('has-bg');
            if (hasLevel && useRing(d)) {
                classes.push('layout-ring');
                renderRing(d);
            }
            tile.className = classes.join(' ').trim();
            if (classes.indexOf('theme-symcon') >= 0 && isDarkText(tile)) {
                tile.classList.add('sym-light');
            }
            $('bgdim').style.opacity = ((d.bgDim || 0) / 100).toFixed(2);
            fish.color = getComputedStyle(tile).getPropertyValue('--fish').trim() || fish.color;
            setFish(fishOn && !paused && classes.indexOf('layout-ring') < 0);

            if ($('detail').classList.contains('open')) {
                renderDetail(d);
            }
        }

        // ---------- Bedienung ----------
        $('tile').addEventListener('click', function (ev) {
            var detail = $('detail');
            if ($('dOpen').contains(ev.target)) {
                // Symcon 8.2+: Variable mit Verlauf in der Visualisierung öffnen
                if (last && last.openId && typeof window.openObject === 'function') {
                    window.openObject(last.openId);
                }
                return;
            }
            // In der Detailansicht schließt jeder Klick außer „Verlauf öffnen“
            if (detail.classList.contains('open')) {
                detail.classList.remove('open');
            } else if (last) {
                renderDetail(last);
                detail.classList.add('open');
            }
        });

        // Animationen anhalten, solange die Kachel nicht zu sehen ist
        var paused = false, inView = true;
        function updatePause() {
            var p = document.hidden || !inView;
            if (p !== paused) {
                paused = p;
                $('tile').classList.toggle('paused', p);
                setFish(!p && $('tile').classList.contains('show-fish') && !$('tile').classList.contains('layout-ring'));
            }
        }
        document.addEventListener('visibilitychange', updatePause);
        if (window.IntersectionObserver) {
            new IntersectionObserver(function (entries) {
                inView = entries[0].isIntersecting;
                updatePause();
            }).observe($('tile'));
        }

        // Himmel alle 5 Minuten nachführen
        setInterval(function () {
            if (last && !paused) render(last);
        }, 300000);

        // Bei Größenänderung zwischen Szene und Ring umschalten
        if (window.ResizeObserver) {
            var lastRing = null;
            new ResizeObserver(function () {
                if (!last || typeof last.level !== 'number') return;
                var r = useRing(last);
                if (r !== lastRing) {
                    lastRing = r;
                    render(last);
                }
            }).observe($('tile'));
        }

        buildDecor();
        translateStatic(document);

        // Wird von IP-Symcon bei UpdateVisualizationValue() aufgerufen
        window.handleMessage = function (data) {
            try {
                render(typeof data === 'string' ? JSON.parse(data) : data);
            } catch (e) {
                console.error('Pegelstand-Kachel:', e);
            }
        };

        var initial = /*INITIAL_DATA*/null;
        if (initial) {
            window.handleMessage(initial);
        }
    })();
</script>
